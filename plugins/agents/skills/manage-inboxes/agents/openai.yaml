interface:
  display_name: "Manage Inboxes"
  short_description: "Create and inspect wzrdmail inboxes"
  default_prompt: "Use $manage-inboxes to create, list, or inspect wzrdmail inboxes."
dependencies:
  tools:
    - type: "mcp"
      value: "wzrdmail"
      description: "wzrdmail hosted MCP server"
      transport: "streamable_http"
