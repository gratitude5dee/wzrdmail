# Copy to scripts/config.toml (gitignored) and fill in.
# scripts/setup.ts reads this to provision resources and set Worker secrets.

[cloudflare]
account_id = ""
# API token perms: Email Routing:Edit, Zone:Edit, DNS:Edit, Workers Scripts:Edit
api_token = ""
zone = "wzrd.tech"

[secrets]
# 32 bytes hex each; generate with: openssl rand -hex 32
session_secret = ""
otp_pepper = ""
api_key_pepper = ""

[connect]
# Shared by the API and the MCP Worker: the consent page presents it to the
# API's /v0/connect/* routes, which 404 without it. The SAME value must reach
# both Workers, so keep it here rather than generating one per run.
# 32 bytes hex; generate with: openssl rand -hex 32
secret = ""

[stripe]
secret_key = ""
webhook_secret = ""
price_developer = ""
price_startup = ""

[ops]
platform_alert_email = ""
